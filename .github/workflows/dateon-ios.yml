# דייטון – בניית אפליקציית אייפון
# 1) בכל דחיפה: בדיקה שהאפליקציה נבנית (לסימולטור, בלי חתימה)
# 2) הפעלה ידנית ("Run workflow") אחרי שהגדרתם את מפתח App Store Connect:
#    בנייה חתומה והעלאה ישירה ל-App Store Connect / TestFlight. ההוראות ב-dateon-app/STORE.md
name: Dateon iOS

on:
  push:
    paths: ["date-planner/**", "dateon-app/**", ".github/workflows/dateon-ios.yml"]
  workflow_dispatch:
    inputs:
      upload:
        description: "לבנות חתום ולהעלות ל-App Store Connect"
        type: boolean
        default: true

concurrency:
  group: dateon-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: dateon-app
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dateon-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Copy web app and sync iOS
        run: npm run sync -- ios

      - name: Build check (simulator, unsigned)
        if: ${{ github.event_name == 'push' || !inputs.upload }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Archive and upload to App Store Connect
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Missing ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 / APPLE_TEAM_ID secrets (see dateon-app/STORE.md)"; exit 1
          fi
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY_PATH -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Dateon.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} MARKETING_VERSION=1.0 \
            $AUTH archive | tail -30
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Dateon.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -30
          echo "::notice::Uploaded build ${{ github.run_number }} to App Store Connect – it appears in TestFlight after processing"
