<style>html,body{margin:0;height:100%;height:100dvh;width:100%;overscroll-behavior:none;-webkit-touch-callout:none;overflow:hidden;background:#000;font-family:"Arial Rounded MT Bold",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 3px 0 #000a;z-index:5}
#ui{background:linear-gradient(#3fb3ff,#0a6fc2);overflow:auto}#ui.h,#rot.h{display:none}

.card,.row,h1,h2{position:relative}.b{transition:transform .1s}.b:active{transform:scale(.9)}
.lc{width:84px;height:84px;font-size:28px;border-radius:20px;animation:pi .5s cubic-bezier(.3,1.6,.5,1) backwards}.lc .i{font-size:22px;display:block}

.b:disabled{filter:grayscale(1) brightness(.7)}.s{display:block;font-size:13px;color:#fff6a0}

.card{background:#fff2;border:3px solid #fff8;border-radius:20px;padding:14px 26px;text-align:center}#ui{justify-content:safe center}

.wc:active{transform:scale(.92)}.wc:disabled{filter:grayscale(1) brightness(.6)}.wc span{font-size:14px}
.lc{height:auto!important;min-height:84px}.nm{display:block;font-size:11px;color:#fff;opacity:.95;white-space:nowrap;max-width:110px;overflow:hidden}

#ui.fin{background:rgba(0,20,60,.35)!important}

function ppDraw(){let h='<h1>📱 טלפון אחד</h1><h2>כל שחקן משחק בתורו על אותם שלבים, והניקוד הגבוה מנצח</h2><div class="row">';PP.names.forEach((n,i)=>h+=`<input class="ppn" value="${esc(n)}" maxlength="14" style="width:120px">`);
 h+=`</div><div class="row">${PP.names.length<6?'<button class="b" onclick="ppSync();PP.names.push(\'שחקן \'+(PP.names.length+1));ppDraw()">➕ שחקן</button>':''}${PP.names.length>2?'<button class="b" onclick="ppSync();PP.names.pop();ppDraw()">➖</button>':''}`;
 [[60,'דקה'],[120,'2 דק׳']].forEach(([d,t])=>h+=`<button class="b" style="${PP.dur==d?'background:linear-gradient(#7dff7a,#1aa02a)':''}" onclick="ppSync();PP.dur=${d};ppDraw()">⏱ ${t}</button>`);
 ui.innerHTML=h+'</div><div class="row"><button class="b" onclick="ppSync();ppGo()">▶ התחל</button><button class="b" onclick="snd(\'click\');friendsMenu()">◀ חזרה</button></div>'}
function ppSync(){PP.names=[...document.querySelectorAll('.ppn')].map((e,i)=>e.value.trim().slice(0,14)||'שחקן '+(i+1))}
function ppGo(){snd('click');PP.seed=Math.floor(Math.random()*1e9);PP.players=PP.names.map(n=>({n,score:0,lv:0}));PP.cur=0;ppTurn()}
function ppTurn(){RUN=null;ui.className='ov';let p=PP.players[PP.cur];ui.innerHTML=`<div class="card"><h1>📱 העבר את הטלפון</h1><h2 style="font-size:30px;color:#ffd21f">התור של ${esc(p.n)}</h2><h2>${fmt(PP.dur)} · ${PP.cur+1}/${PP.players.length}</h2><div class="row"><button class="b" onclick="startRun('pp',PP.dur,PP.seed)">▶ מוכן!</button><button class="b" onclick="goHome()">☰ ראשי</button></div></div>`}
// ---- podium ----
function podium(list,title,again){list=list.slice().sort((a,b)=>b.score-a.score);showLB(0);ui.className='ov';let ord=[1,0,2],hgt=[110,80,60],med=['🥇','🥈','🥉'],h=`<h1>${title}</h1><div class="pod">`;
 ord.forEach(r=>{let p=list[r];if(!p)return;h+=`<div class="pc"><div class="pn">${med[r]} ${esc(p.n)}${p.me?' (אתה)':''}</div><div class="ps">${p.score}</div><div class="pb" style="height:${hgt[r]}px;background:${['#ffd21f','#d8d8e8','#e09050'][r]}">${r+1}</div></div>`});
 h+='</div>';if(list.length>3)h+='<div class="row">'+list.slice(3).map((p,i)=>`<span class="tb" style="font-size:14px">${i+4}. ${esc(p.n)} ${p.score}</span>`).join('')+'</div>';
 ui.innerHTML=h+`<div class="row">${again?`<button class="b" onclick="snd('click');${again}">🔄 עוד סיבוב</button>`:''}<button class="b" onclick="goHome()">☰ ראשי</button></div>`;for(let k=0;k<4;k++)setTimeout(()=>{try{snd('firework')}catch(e){}},k*300)}
// ---- HUD additions ----
function modeHud(){if(!RUN||!lv)return;let X=W/2,Y=96;x.textAlign='center';x.textBaseline='middle';
 if(RUN.kind=='sr'){let t=RUN.frames/60,s='⏱ '+t.toFixed(1),b=BEST[SK(lv)];if(b)s+='   🏅 '+b.toFixed(1);if(CH&&CH.kind=='lv'&&CH.l==lv.i)s+='   ⚔️ '+CH.t.toFixed(1);rr(X-130,Y-18,260,36,12);fs('#0009','#fff6',2);x.font='bold 20px Arial';x.fillStyle='#fff';x.fillText(s,X,Y);return}
 let tl=tLeft(),low=tl<10;rr(X-150,Y-20,300,40,12);fs(low&&T%30<15?'#a00c':'#0009','#fff6',2);x.font='bold 22px Arial';x.fillStyle=low?'#ffd0d0':'#fff';x.fillText('⏱ '+fmt(Math.ceil(tl))+'    סה״כ '+runTotal(),X,Y);
 if(RUN.kind=='ta'&&CH&&CH.kind=='ta'&&CH.seed==RUN.seed){x.font='bold 15px Arial';x.fillStyle='#ffd21f';x.fillText('⚔️ '+CH.n+': '+CH.s,X,Y+30)}
 if(RUN.kind=='mp'&&T%20==0)drawLB()}
function showLB(on){let d=document.getElementById('lb');d.style.display=on?'block':'none';if(on)drawLB()}
function drawLB(){if(!MP)return;let d=document.getElementById('lb');if(MP.me&&MP.players[MP.me]&&RUN&&!RUN.over)MP.players[MP.me].score=runTotal();let ps=Object.entries(MP.players).sort((a,b)=>b[1].score-a[1].score);
 d.innerHTML='<b>🏆 טבלה חיה</b>'+ps.map(([id,p],i)=>`<div class="${id==MP.me?'me':''}${p.on?'':' off'}">${i+1}. ${esc(p.n)} <span>${p.score}</span>${p.on?(p.fin?' ✅':''):' 📴'}</div>`).join('')}
// ---- multiplayer (PeerJS public broker, peer-to-peer data channels) ----
const MP_PREFIX='trickshot8-',CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function loadPeer(){if(window.Peer)return Promise.resolve();return new Promise((ok,no)=>{let urls=['https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js','https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'],i=0;
 const tryN=()=>{if(i>=urls.length)return no(new Error('load'));let s=document.createElement('script');s.src=urls[i++];s.onload=()=>window.Peer?ok():tryN();s.onerror=tryN;document.head.appendChild(s)};tryN()})}
function mpMsg(h){ui.className='ov';ui.innerHTML=`<div class="card">${h}<div class="row"><button class="b" onclick="goHome()">◀ ביטול</button></div></div>`}
function mpFail(m){if(MP)mpLeave();mpMsg(`<h1>😕 אופס</h1><h2>${m}</h2><div class="row"><button class="b" onclick="friendsMenu()">נסה שוב</button></div>`)}
function newCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s}
async function mpHost(code,tries){snd('click');mpMsg('<h1>⏳ פותח חדר...</h1>');try{await loadPeer()}catch(e){return mpFail('אין חיבור לאינטרנט, או ששרת התחרויות לא זמין.')}
 code=code||newCode();let peer=new Peer(MP_PREFIX+code,{debug:0});MP={host:1,peer,code,me:'H',players:{H:{n:NAME,score:0,on:1,fin:0}},conns:{},dur:(MP&&MP.dur)||120,state:'lobby'};
 peer.on('open',()=>mpLobby());peer.on('error',e=>{if(e.type=='unavailable-id'&&(tries||0)<4){peer.destroy();return mpHost(null,(tries||0)+1)}if(MP&&MP.state=='lobby'&&!MP.opened)mpFail('לא הצלחתי לפתוח חדר ('+e.type+').')});
 peer.on('disconnected',()=>{try{if(MP&&MP.peer==peer&&!peer.destroyed)peer.reconnect()}catch(e){}});
 peer.on('connection',c=>{c.on('data',d=>mpHostData(c,d));c.on('close',()=>mpDrop(c.peer));c.on('error',()=>mpDrop(c.peer))})}
function mpHostData(c,d){if(!MP||!MP.host||!d)return;let id=c.peer,PL=MP.players;(MP.seen=MP.seen||{})[id]=Date.now();if(d.t=='pg'){if(PL[id]&&!PL[id].on&&MP.state!='lobby'){PL[id].on=1;MP.conns[id]=c;mpBroadcast()}return}
 if(d.t=='hi'){if(MP.state!='lobby'){c.send({t:'busy'});setTimeout(()=>c.close(),500);return}let n=String(d.n||'שחקן').slice(0,14);if(Object.values(PL).filter(p=>p.on).length>=8){c.send({t:'full'});return}
  MP.conns[id]=c;PL[id]={n,score:0,on:1,fin:0};mpBroadcast();snd('click')}
 else if(d.t=='sc'&&PL[id]){PL[id].score=+d.s||0;if(d.fin)PL[id].fin=1;mpBroadcast();mpCheckEnd()}}
function mpDrop(id){if(!MP)return;if(MP.host){if(MP.players[id]){MP.players[id].on=0;delete MP.conns[id];if(MP.state=='lobby')delete MP.players[id];mpBroadcast();mpCheckEnd();toast('שחקן התנתק')}}}
function mpBroadcast(extra){if(!MP||!MP.host)return;if(RUN&&RUN.kind=='mp'&&!RUN.over)MP.players.H.score=runTotal();let m=Object.assign({t:'ros',p:MP.players,dur:MP.dur,st:MP.state},extra||{});for(const c of Object.values(MP.conns))try{c.open&&c.send(m)}catch(e){}if(MP.state=='lobby')mpLobby();else drawLB()}
function mpLobby(){if(!MP)return;MP.opened=1;let link=GAME_URL+'?room='+MP.code,ps=Object.values(MP.players).filter(p=>p.on);ui.className='ov';
 let h=`<h1>🏠 חדר ${MP.host?'':'של חברים'}</h1><h2 style="font-size:40px;letter-spacing:6px;color:#ffd21f">${MP.code}</h2><h2>שחקנים (${ps.length}): ${ps.map(p=>esc(p.n)).join(' · ')}</h2>`;
 if(MP.host){h+='<div class="row">'+[[60,'דקה'],[120,'2 דק׳'],[180,'3 דק׳']].map(([d,t])=>`<button class="b" style="${MP.dur==d?'background:linear-gradient(#7dff7a,#1aa02a)':''}" onclick="MP.dur=${d};mpBroadcast()">⏱ ${t}</button>`).join('')+'</div>';
  h+=`<div class="row"><button class="b" onclick="snd('click');shareLink('${link}','בוא להתחרות נגדי בזריקות טריק! קוד חדר: ${MP.code} 🏀')">📲 שלח הזמנה</button><button class="b" id="mpgo" ${ps.length<2?'disabled':''} onclick="mpStart()">▶ התחל תחרות</button></div><h2 style="font-size:13px;opacity:.8">${ps.length<2?'מחכה שחברים יצטרפו...':'כולם כאן? לחץ התחל!'}</h2>`}
 else h+=`<h2>⏱ ${fmt(MP.dur)} · מחכים שהמארח יתחיל...</h2>`;ui.innerHTML=h+'<div class="row"><button class="b" onclick="goHome()">◀ יציאה</button></div>'}
function mpStart(){if(!MP||!MP.host)return;snd('click');MP.state='play';MP.seed=Math.floor(Math.random()*1e9);for(const p of Object.values(MP.players)){p.score=0;p.fin=0}for(const k in MP.players)if(!MP.players[k].on)delete MP.players[k];
 mpBroadcast({go:1,seed:MP.seed});startRun('mp',MP.dur,MP.seed)}
async function mpJoin(code){snd('click');code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4)return toast('כתוב קוד חדר');mpMsg('<h1>⏳ מתחבר לחדר '+esc(code)+'...</h1>');
 try{await loadPeer()}catch(e){return mpFail('אין חיבור לאינטרנט, או ששרת התחרויות לא זמין.')}
 let peer=new Peer({debug:0});MP={host:0,peer,code,me:null,players:{},dur:120,state:'lobby'};let to=setTimeout(()=>{if(MP&&MP.peer==peer&&!MP.opened)mpFail('לא מצאתי את החדר '+esc(code)+'. בדוק את הקוד ושהמארח עדיין בחדר.')},15000);
 peer.on('error',e=>{if(MP&&MP.peer==peer&&!MP.opened){clearTimeout(to);mpFail(e.type=='peer-unavailable'?'החדר '+esc(code)+' לא קיים או שנסגר.':'בעיית חיבור ('+e.type+').')}});
 peer.on('open',id=>{if(!MP||MP.peer!=peer)return;MP.me=id;let c=peer.connect(MP_PREFIX+code,{reliable:true});MP.hc=c;
  c.on('open',()=>{clearTimeout(to);c.send({t:'hi',n:NAME})});c.on('data',d=>mpGuestData(d));c.on('close',()=>mpHostGone())})}
function mpGuestData(d){if(!MP||!d)return;MP.lastHost=Date.now();if(d.t=='pg')return;if(d.t=='busy'){mpFail('התחרות בחדר הזה כבר התחילה. בקש מהמארח לפתוח סיבוב חדש.');return}if(d.t=='full'){mpFail('החדר מלא (8 שחקנים).');return}
 if(d.t=='ros'){let mine=MP.players[MP.me];MP.players=d.p;if(mine&&RUN&&RUN.kind=='mp'&&!RUN.over&&MP.players[MP.me])MP.players[MP.me].score=runTotal();MP.dur=d.dur;MP.opened=1;
  if(d.go){MP.state='play';MP.seed=d.seed;startRun('mp',d.dur,d.seed)}else if(d.st=='lobby'&&MP.state!='play'){MP.state='lobby';if(!RUN)mpLobby()}else if(d.st=='lobby'&&MP.state=='end'){MP.state='lobby';mpLobby()}else if(d.st=='end'&&MP.state!='end'){MP.state='end';mpPodium()}else drawLB()}}
function mpHostGone(){if(!MP||MP.host)return;MP.hostGone=1;toast('המארח התנתק 📴');if(RUN&&!RUN.over)return;if(MP.state=='end')return;mpFail('המארח עזב את החדר.')}
function mpSendScore(fin){if(!MP||!RUN)return;let s=runTotal();if(MP.host){MP.players.H.score=s;if(fin===2)MP.players.H.fin=1;if(fin||s!=MP.last){MP.last=s;mpBroadcast();if(fin===2)mpCheckEnd()}return}
 if(MP.players[MP.me])MP.players[MP.me].score=s;if((fin||s!=MP.last)&&MP.hc&&MP.hc.open){MP.last=s;try{MP.hc.send({t:'sc',s,fin:fin===2?1:0})}catch(e){}}drawLB()}
function mpOwnEnd(tot){mpSendScore(2);if(MP&&!MP.host&&MP.hostGone){MP.state='end';return mpPodium()}ui.className='ov fin';ui.innerHTML=`<div class="card"><h1>⏱ הזמן נגמר!</h1><h2 style="font-size:32px;color:#ffd21f">${tot} נקודות</h2><h2>מחכים לשאר השחקנים...</h2></div>`;showLB(1);
 if(MP&&MP.host){MP.endTO=setTimeout(()=>mpFinal(),8000)}}
function mpCheckEnd(){if(!MP||!MP.host||MP.state!='play')return;let on=Object.values(MP.players).filter(p=>p.on);if(on.every(p=>p.fin))mpFinal()}
function mpFinal(){if(!MP||MP.state!='play')return;clearTimeout(MP.endTO);MP.state='end';mpBroadcast();mpPodium()}
function mpPodium(){if(!MP)return;RUN=null;lv=null;podium(Object.entries(MP.players).map(([id,p])=>({n:p.n+(p.on?'':' 📴'),score:p.score,me:id==MP.me})),'🏆 תוצאות התחרות',MP.host?'mpAgain()':'')}
function mpAgain(){if(!MP||!MP.host)return;MP.state='lobby';for(const p of Object.values(MP.players)){p.score=0;p.fin=0}mpBroadcast()}
function mpLeave(){let m=MP;MP=null;showLB(0);if(!m)return;try{if(m.hc)m.hc.close()}catch(e){}try{for(const c of Object.values(m.conns||{}))c.close()}catch(e){}setTimeout(()=>{try{m.peer.destroy()}catch(e){}},300)}
addEventListener('pagehide',()=>{if(MP)try{MP.peer.destroy()}catch(e){}});
// ---- deep links ----
function boot(){let q=new URLSearchParams(location.search),room=(q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,5),ch=q.get('ch');if(room||ch)try{history.replaceState(null,'',location.pathname)}catch(e){}
 if(room){ui.className='ov';ui.innerHTML=`<div class="card"><h1>👥 הוזמנת לתחרות!</h1><h2>חדר ${esc(room.toUpperCase())}</h2><div class="row"><input id="nm" placeholder="השם שלך" maxlength="14" value="${esc(NAME)}"></div><div class="row"><button class="b" onclick="setName(nm.value);if(!NAME)return toast('כתוב את השם שלך');mpJoin('${esc(room).replace(/'/g,'')}')">הצטרף ▶</button><button class="b" onclick="menu()">☰ ראשי</button></div></div>`;return}
 if(ch=='ta'){let d=+q.get('d'),seed=+q.get('seed'),s=+q.get('s')||0,n=(q.get('n')||'חבר').slice(0,14);if([60,120,300].includes(d)&&seed>0){CH={kind:'ta',d,seed,s,n};ui.className='ov';ui.innerHTML=`<div class="card"><h1>⚔️ אתגר!</h1><h2 style="font-size:26px">${esc(n)} השיג <span style="color:#ffd21f">${s}</span> נקודות ב-${fmt(d)}</h2><h2>אותם שלבים בדיוק. תצליח לעקוף?</h2><div class="row"><button class="b" onclick="startRun('ta',${d},${seed})">▶ קבל את האתגר</button><button class="b" onclick="CH=null;menu()">☰ ראשי</button></div></div>`;return}}
 if(ch=='lv'){let l=+q.get('l'),t=+q.get('t'),n=(q.get('n')||'חבר').slice(0,14);if(L[l]&&t>0){CH={kind:'lv',l,t,n};let lvl=L[l],w=WORLDS.find(w=>w.id==lvl.w);ui.className='ov';ui.innerHTML=`<div class="card"><h1>⚔️ אתגר!</h1><h2 style="font-size:24px">${esc(n)} סיים את "${esc(lvl.n)}" (${w.ic} ${w.n}) ב-<span style="color:#ffd21f">${t.toFixed(2)}</span> שניות</h2><h2>תצליח מהר יותר?</h2><div class="row"><button class="b" onclick="MODE='sr';RUN=null;start(${l})">▶ קבל את האתגר</button><button class="b" onclick="CH=null;menu()">☰ ראשי</button></div></div>`;return}}
 menu()}
// heartbeat: detect silent drops (phone locked / lost signal)
setInterval(()=>{if(!MP)return;let now=Date.now();
 if(MP.host){MP.seen=MP.seen||{};let ch=0;for(const[id,p]of Object.entries(MP.players)){if(id=='H')continue;let ls=MP.seen[id]||now;if(p.on&&now-ls>15000){p.on=0;ch=1;toast(p.n+' התנתק 📴')}}if(ch){mpBroadcast();mpCheckEnd()}else if(MP.state!='lobby')mpBroadcast({hb:1});else for(const c of Object.values(MP.conns))try{c.open&&c.send({t:'pg'})}catch(e){}}
 else if(MP.hc&&MP.hc.open){try{MP.hc.send({t:'pg'})}catch(e){}if(MP.opened&&MP.lastHost&&now-MP.lastHost>15000&&!MP.hostGone){MP.hostGone=1;toast('המארח התנתק 📴');if(RUN&&RUN.over&&MP.state!='end'){MP.state='end';mpPodium()}}}},4000);

boot();requestAnimationFrame(loop);
</script></body></html>
