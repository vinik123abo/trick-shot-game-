<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b3b66;font-family:"Arial Rounded MT Bold",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 3px 0 #000a;z-index:5}
#ui{background:linear-gradient(#3fb3ff,#0a6fc2);overflow:auto}#ui.h,#rot.h{display:none}
h1{font-size:54px;margin:6px;color:#ffd21f;-webkit-text-stroke:2px #7a3b00;text-shadow:0 5px 0 #7a3b00,0 10px 20px #0006;animation:tb 1.6s ease-in-out infinite}
@keyframes tb{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
#ui{background:radial-gradient(circle at 50% 30%,#6fd0ff,#0a6fc2 70%,#05427a)!important}
#ui{overflow-x:hidden!important}#ui:before{content:"";position:fixed;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 30%,#fff1 0 10deg,#0000 10deg 20deg);animation:sp 30s linear infinite;pointer-events:none}@keyframes sp{to{transform:rotate(360deg)}}
.card,.row,h1,h2{position:relative}.b{transition:transform .1s}.b:active{transform:scale(.9)}
.lc{width:84px;height:84px;font-size:28px;border-radius:20px;animation:pi .5s cubic-bezier(.3,1.6,.5,1) backwards}.lc .i{font-size:22px;display:block}
@keyframes pi{from{transform:scale(0)}to{transform:scale(1)}}.card{animation:pi .45s cubic-bezier(.3,1.6,.5,1) both;background:linear-gradient(#ffffff40,#ffffff18);backdrop-filter:blur(4px)}h2{margin:2px;font-size:20px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:4px}
.b{font:bold 20px Arial;min-width:64px;padding:8px 12px;border:3px solid #7a3b00;border-radius:16px;background:linear-gradient(#ffcc33,#ff8a00);color:#fff;text-shadow:0 2px 0 #a04800;box-shadow:0 4px 0 #7a3b00}
.b:disabled{filter:grayscale(1) brightness(.7)}.s{display:block;font-size:13px;color:#fff6a0}
#rot{background:#0a6fc2;font-size:26px;z-index:9;text-align:center}#rot div{font-size:80px;animation:r 1.5s infinite}@keyframes r{50%{transform:rotate(90deg)}}
.card{background:#fff2;border:3px solid #fff8;border-radius:20px;padding:14px 26px;text-align:center}</style></head><body>

if(ball.fly!=1)return;let b=ball;b.age++;if(T%2)trail.push({x:b.x,y:b.y,l:16});let sub=3;for(let s=0;s<sub;s++){b.vy+=.42/sub;b.x+=b.vx/sub;b.y+=b.vy/sub;
if(lv.s=='d'){b.a=Math.atan2(b.vy,b.vx);for(const c of cols)if(b.x>c[0]&&b.x<c[0]+c[2]&&b.y>c[1]&&b.y<c[1]+c[3]){stuck.push({x:b.x,y:b.y,a:b.a});pop('!בום',b.x,b.y-30,'#f55');snd('hit');sad=60;return endBall()}
let[bx,,br]=lv.board;if(b.x>=bx-6){let d=Math.abs(b.y-lv.by),p=d<br*.12?50:d<br*.35?25:d<br*.65?10:d<br?5:0;if(p){score+=p;stuck.push({x:bx-6,y:b.y,a:b.a,dy:b.y-lv.by,m:1});pop(p==50?'!בול 50':'+'+p,bx-60,b.y-30,p>=25?'#ffd21f':'#fff',p==50?48:36);snd('hit');buzz(30);shake=p==50?10:4;if(p>=25){cel=60;stars(bx,b.y)}if(p==50){boom(bx,b.y);slow=40;snd('cheer')}return endBall()}}
if(b.y>G||b.x>W+40){pop('פספוס','#f66');pop('פספוס',b.x<W?b.x:W-80,G-40,'#f66');return endBall()}continue}
for(const c of cols)coll(b,c,.55);
if(b.y>G-R){b.y=G-R;if(b.vy>2){b.bounce++;dust(b.x,G,b.vy);snd('bounce')}b.vy*=-.55;b.vx*=.985}
if(b.x<R){b.x=R;b.vx*=-.6}if(b.y<-400)b.vy=Math.abs(b.vy);
if(lv.s=='b')for(const h of hoops){coll(b,[h.x+28,h.y-53,8,70],.5);coll(b,[h.x+24,h.y-53,42,46],.5);pt(b,h.x-28,h.y,.4);pt(b,h.x+28,h.y,.4);
if(!h.ok&&b.vy>0&&Math.abs(b.x-h.x)<22&&b.y>h.y-4&&b.y<h.y+8){h.ok=1;h.sw=T;b.hits++;score+=500;pop('+500',h.x,h.y-60,'#fff',46);boom(h.x,h.y);stars(h.x,h.y);snd('swish');buzz(40);cel=60;if(b.hits>1||b.bounce){slow=50;shake=14;snd('cheer')}else shake=5;if(b.bounce)pop('!זריקה מהקרש',h.x,h.y-110,'#ffd21f',30)}}
if(lv.s=='f'){coll(b,[830,G-150,110,10],.4);if(lv.keep)coll(b,[792,G-110-keeper.y,42,110],.6);
if(!b.goal&&b.x>850&&b.y>G-140){b.goal=1;b.hits=1;score+=1000;snd('swish');snd('cheer');buzz(60);cel=80;shake=12;slow=40;stars(880,G-70);pop('!גוֹל',870,G-200,'#ffd21f',56);boom(880,G-70,40);b.vx*=.2}}}
if(b.x>W+60||b.age>700){pop(lv.s=='b'?'פספוס':'',W/2,300,'#f66');return endBall()}
if(b.y>=G-R-1&&Math.abs(b.vx)<.4&&Math.abs(b.vy)<1.5){if(++b.still>20)return endBall()}else b.still=0;
if(b.goal&&b.age>0&&b.x>930)b.vx=0}
// ---------- drawing ----------
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}
function fs(f,s,lw){x.fillStyle=f;x.fill();if(s){x.strokeStyle=s;x.lineWidth=lw||3;x.stroke()}}
function dust(X,Y,v){for(let i=0;i<Math.min(14,4+v*2);i++)parts.push({x:X,y:Y,vx:(Math.random()-.5)*4,vy:-Math.random()*2,l:30,c:'#d9b48a',r:4+Math.random()*5,d:1})}
function stars(X,Y){for(let i=0;i<14;i++){let a=i/14*6.28;parts.push({x:X,y:Y,vx:Math.cos(a)*6,vy:Math.sin(a)*6,l:40,c:'#ffe23a',st:1,r:9})}}
function shadow(X,w,hgt){let k=Math.max(.2,1-hgt/400);x.fillStyle=`rgba(40,15,0,${.35*k})`;x.beginPath();x.ellipse(X,G+2,w*k,w*.25*k,0,0,7);x.fill()}
let BG;const IMG={};for(const k in ART){IMG[k]=new Image();IMG[k].src=ART[k]}
function ok(k){return IMG[k]&&IMG[k].complete&&IMG[k].naturalWidth}
function bg(){if(ok('bg'))x.drawImage(IMG.bg,-109,0,1178,662);
for(let i=0;i<4;i++){let bx=((i*300+T*.6)%(W+100))-50,by=110+i*25+Math.sin(T/20+i)*6,f=Math.sin(T/5+i)*5;x.strokeStyle='#234';x.lineWidth=2;x.beginPath();x.moveTo(bx-8,by-f);x.quadraticCurveTo(bx-4,by-3,bx,by);x.quadraticCurveTo(bx+4,by-3,bx+8,by-f);x.stroke()}
let bx=W+60-((T*.25)%(W+120)),by=372+Math.sin(T/25)*1.5;x.fillStyle='#fff';x.beginPath();x.moveTo(bx-22,by);x.lineTo(bx+22,by);x.lineTo(bx+16,by+8);x.lineTo(bx-16,by+8);x.fill();x.fillStyle='#e8262c';x.fillRect(bx-22,by+4,44,3);x.fillStyle='#fff';x.beginPath();x.moveTo(bx,by-2);x.lineTo(bx,by-28);x.lineTo(bx-15,by-4);x.fill();
x.strokeStyle='#ffffff90';x.lineWidth=1.5;for(let i=0;i<16;i++){let wx=(i*97+T*(.2+i%3*.1))%W,wy=350+(i*37)%75,ww=10+i%4*5,a=.5+.5*Math.sin(T/30+i);x.globalAlpha=a;x.beginPath();x.moveTo(wx,wy);x.quadraticCurveTo(wx+ww/2,wy-2,wx+ww,wy);x.stroke()}x.globalAlpha=1}
function bball(X,Y,a,sh){if(sh!==0&&lv)shadow(X,14,G-Y);if(!ok('ball'))return;x.save();x.translate(X,Y);x.rotate(a);x.drawImage(IMG.ball,-R-1,-R-1,2*R+2,2*R+2);x.restore()}
function hoop(h){let X=h.x,Y=h.y,e=h.sw?T-h.sw:99,sw=e<40?Math.sin(e/40*3.14)*(1-e/40):0,k=.906;
let pb=Y+85;if(pb<G){let g=x.createLinearGradient(X+63,0,X+73,0);g.addColorStop(0,'#8a96a0');g.addColorStop(.5,'#5a646e');g.addColorStop(1,'#2a3036');x.fillStyle=g;x.fillRect(X+63,pb-4,10,G-pb+4);x.strokeStyle='#1a1e22';x.lineWidth=2;x.strokeRect(X+63,pb-4,10,G-pb+4)}
if(ok('hoop')){x.save();x.beginPath();x.rect(0,0,W,G+4);x.clip();x.drawImage(IMG.hoop,X-28.5,Y-55,118*k,155*k);if(sw>0){let ny=63,nh=48;x.drawImage(IMG.hoop,0,ny,64,nh,X-28.5,Y-55+ny*k,64*k,nh*k*(1+sw*.6))}x.restore()}
if(h.ok){x.font='bold 22px Arial';x.textAlign='center';x.fillStyle='#4f4';x.strokeStyle='#060';x.lineWidth=3;x.strokeText('✔',X,Y-24);x.fillText('✔',X,Y-24)}}
function tires(n){if(!n||!ok('tires'))return;shadow(PX,62,0);let im=IMG.tires,th=im.height/3,sy=im.height-th*n;x.drawImage(im,0,sy,im.width,th*n,PX-50,G-n*44-4,100,n*44+6)}
function player(){let px=PX,y=pY(),thr=ball.fly==1&&ball.age<22,br=Math.sin(T/18),jump=cel>0?Math.abs(Math.sin(cel/8))*22:0;y-=jump;if(cel>0)cel--;if(sad>0)sad--;
if(!lv.t)shadow(px,26,jump);let k=.54,im,ox;if(cel>0){im=IMG.cel;ox=34}else if(thr||ball.fly==1||drag||lv.s!='b'){im=IMG.throw;ox=46}else{im=IMG.idle;ox=43}
if(!im||!im.complete)return;let sy=1+br*.015,sx=1-br*.01;if(thr&&ball.age<6){sy=.94;sx=1.05}if(drag){let a=aim();sy=1-a.m*.06;sx=1+a.m*.04}
x.save();x.translate(px,y);if(sad>0)x.rotate(Math.sin(T/6)*.03);x.scale(sx,sy);x.drawImage(im,-ox*k,-im.height*k,im.width*k,im.height*k);x.restore();
if(sad>30){x.font='22px Arial';x.textAlign='center';x.fillText('😩',px+18,y-140)}}
function tileImg(im,X,Y,w,h,horiz){if(!im.complete)return;let ar=im.width/im.height;if(horiz){let n=Math.max(1,Math.round(w/(h*ar))),tw=w/n;for(let i=0;i<n;i++)x.drawImage(im,X+i*tw,Y,tw+.5,h)}else{let n=Math.max(1,Math.round(h/(w/ar))),th=h/n;for(let i=0;i<n;i++)x.drawImage(im,X,Y+i*th,w,th+.5)}}
function shelf(X,Y,w,h){if(w>=h)tileImg(IMG.shelf,X,Y-2,w,h+4,1);else{let im=IMG.shelf,n=Math.max(1,Math.round(h/(w/1.97*1.4))),th=h/n;for(let i=0;i<n;i++)x.drawImage(im,X-3,Y+i*th,w+6,th+.5)}}
function barrel(X,Y,w,h){if(Y+h>=G-1)shadow(X+w/2,w*.7,0);tileImg(IMG.barrel,X-4,Y,w+8,h,0)}
function pipe(X,Y,w,h){if(!ok('barrel'))return;let im=IMG.barrel,n=Math.max(1,Math.round(w/(h/.636))),tw=w/n;for(let i=0;i<n;i++){x.save();x.translate(X+i*tw+tw/2,Y+h/2);x.rotate(Math.PI/2);x.drawImage(im,-tw/2,-h/2-3,tw+.5,h+6);x.restore()}}
function crate(X,Y,w,h){if(Y+h>=G-1)shadow(X+w/2,w*.7,0);if(ok('crate'))x.drawImage(IMG.crate,X-3,Y-4,w+6,h+6)}
function suitcase(X,Y,w,h){if(ok('case'))x.drawImage(IMG.case,X-2,Y-6,w+4,h+8)}
function wall(X,Y,w,h){shelf(X,Y,w,h)}
function truck(X,lh){shadow(X+120,95,0);if(!ok('truck'))return;let im=IMG.truck,k=1.062,top=G-73,pt=top-lh-16;
let n=4,seg=(top-pt-10)/n;x.lineCap='round';for(const [c,lw] of [['#111',9],['#3a3f46',5]]){x.strokeStyle=c;x.lineWidth=lw;for(let i=0;i<n;i++){let y1=top-i*seg,y2=y1-seg;x.beginPath();x.moveTo(X+130,y1);x.lineTo(X+215,y2);x.moveTo(X+215,y1);x.lineTo(X+130,y2);x.stroke()}}
let by=64.5;x.drawImage(im,0,by,im.width,im.height-by,X,G-(im.height-by)*k,im.width*k,(im.height-by)*k);
x.drawImage(im,116,0,95,18,X+118,pt-2,110,20)}
function board(){let[bx,,r]=lv.board,by=lv.by;rr(bx+4,by-r-14,16,2*r+28,4);fs('#6b3d12','#2a1400',3);if(ok('dart'))x.drawImage(IMG.dart,bx-r*.38,by-r*1.08,r*.76,r*2.16)}
function goal(){let gx=840;x.strokeStyle='#ffffffb0';x.lineWidth=1.2;for(let i=gx;i<gx+100;i+=10){x.beginPath();x.moveTo(i,G-140);x.lineTo(i+12,G);x.stroke()}for(let j=G-140;j<G;j+=12){x.beginPath();x.moveTo(gx,j);x.lineTo(gx+110,j+6);x.stroke()}
if(ok('goal'))x.drawImage(IMG.goal,822,G-156,150,160);
if(lv.keep&&ok('keeper')){let ky=G-keeper.y;x.save();x.translate(813,ky);x.drawImage(IMG.keeper,-34,-112,68,114);x.restore();if(!keeper.y)shadow(813,26,0)}}
function sball(X,Y,a){if(lv&&Y>40)shadow(X,14,G-Y);x.save();x.translate(X,Y);x.rotate(a);x.beginPath();x.arc(0,0,R,0,7);fs('#fff','#222',2);x.fillStyle='#222';x.beginPath();for(let i=0;i<5;i++){let t=i*1.2566-1.57;x.lineTo(Math.cos(t)*5,Math.sin(t)*5)}x.fill();
for(let i=0;i<5;i++){let t=i*1.2566+.3;x.beginPath();x.arc(Math.cos(t)*R*.95,Math.sin(t)*R*.95,3.5,0,7);x.fill()}x.restore()}
function dart(X,Y,a){x.save();x.translate(X,Y);x.rotate(a);x.fillStyle='#ccc';x.fillRect(0,-1.5,12,3);rr(-22,-3.5,24,7,3);fs('#ffd21f','#7a3b00',2);x.beginPath();x.moveTo(-22,0);x.lineTo(-36,-10);x.lineTo(-32,0);x.lineTo(-36,10);x.closePath();fs('#e22','#600',2);x.restore()}
function arrow(){let a=aim(),h=hand(),ang=Math.atan2(a.vy,a.vx),len=40+a.m*130;
x.fillStyle='#fff';for(let i=1;i<14;i++){let t=i*3,px=h.x+a.vx*t,py=h.y+a.vy*t+.21*t*t;x.globalAlpha=1-i/14;x.beginPath();x.arc(px,py,3.5,0,7);x.fill()}x.globalAlpha=1;
x.save();x.translate(h.x,h.y);x.rotate(ang);let g=x.createLinearGradient(0,0,len,0);g.addColorStop(0,'#ffe23a');g.addColorStop(1,'#e8160c');
x.beginPath();x.moveTo(10,-7);x.lineTo(len-20,-7);x.lineTo(len-20,-16);x.lineTo(len+6,0);x.lineTo(len-20,16);x.lineTo(len-20,7);x.lineTo(10,7);x.closePath();fs(g,'#5a0a00',3);x.restore()}
function btn(X,Y,ic,k){let e=T-(btnP[k]||-99),sc=e<12?1-.25*Math.sin(e/12*3.14):1+.03*Math.sin(T/20);x.save();x.translate(X,Y);x.scale(sc,sc);x.translate(-X,-Y);x.beginPath();x.arc(X,Y+3,24,0,7);x.fillStyle='#7a3b00';x.fill();let g=x.createLinearGradient(0,Y-24,0,Y+24);g.addColorStop(0,'#ffcc33');g.addColorStop(1,'#ff7a00');x.beginPath();x.arc(X,Y,24,0,7);fs(g,'#7a3b00',3);x.fillStyle='#fff';x.font='bold 24px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(ic,X,Y+1);x.beginPath();x.ellipse(X-6,Y-12,10,5,-.4,0,7);x.fillStyle='#fff8';x.fill();x.restore()}
function hud(){btn(W-50,38,paused?'▶':'❚❚','p');btn(W-112,38,'↻','r');btn(40,38,'☰','m');
rr(78,16,150,44,14);fs('#0008','#fff6',2);for(let i=0;i<Math.min(balls,5);i++){let X=100+i*27;lv.s=='b'?bball(X,38,0,0):lv.s=='f'?sball(X,38,0):dart(X+8,38,-1.2)}
x.fillStyle='#fff';x.font='bold 26px Arial';x.textAlign='center';x.strokeStyle='#000';x.lineWidth=5;let t=(lv.s=='b'?`סלים ${hoops.filter(h=>h.ok).length}/${hoops.length}   `:lv.s=='d'?`יעד ${lv.need}   `:'')+score;x.strokeText(t,W/2,38);x.fillText(t,W/2,38);
x.font='bold 15px Arial';x.strokeText(lv.n,W/2,64);x.fillText(lv.n,W/2,64);if(!ball.fly&&!done&&!drag){x.font='bold 18px Arial';let s='גרור אחורה כדי לכוון, שחרר כדי לזרוק';x.strokeText(s,W/2,H-22);x.fillText(s,W/2,H-22)}
if(paused){x.fillStyle='#0007';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.font='bold 50px Arial';x.fillText('הפסקה',W/2,H/2)}}
function draw(){x.save();if(shake>.5){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}bg();if(!lv){x.restore();return}
for(const o of lv.o||[]){let[t,a,b,c,d]=o;({shelf,barrel,pipe,crate,wall,case:suitcase})[t]?({shelf,barrel,pipe,crate,wall,case:suitcase})[t](a,b,c,d):t=='truck'&&truck(a,b)}
if(lv.s=='b')hoops.forEach(hoop);if(lv.s=='d'){board();stuck.forEach(s=>dart(s.m?s.x:s.x,s.m?lv.by+s.dy:s.y,s.a))}if(lv.s=='f')goal();
tires(lv.t);player();
if(!(ball.fly==2)&&(ball.fly||lv.s!='b'||drag)){let h=hand();if(!ball.fly){ball.x=h.x;ball.y=h.y}let sp=Math.hypot(ball.vx,ball.vy);if(ball.fly)ball.a+=ball.vx*.03;
lv.s=='b'?bball(ball.x,ball.y,ball.a):lv.s=='f'?sball(ball.x,ball.y,ball.a):dart(ball.x,ball.y,ball.fly?Math.atan2(ball.vy,ball.vx):-.4)}
trail=trail.filter(t=>t.l-->0);trail.forEach(t=>{x.globalAlpha=t.l/16*.6;x.fillStyle=ball.hits?'#ffe23a':'#fff';x.beginPath();x.arc(t.x,t.y,R*t.l/16,0,7);x.fill()});x.globalAlpha=1;if(drag)arrow();
parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.d){p.vx*=.95;p.vy*=.95;x.globalAlpha=p.l/30*.7;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r*(1.6-p.l/30),0,7);x.fill()}else if(p.st){p.vx*=.92;p.vy*=.92;x.globalAlpha=p.l/40;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.l/6);x.beginPath();for(let i=0;i<10;i++){let r=i%2?p.r*.4:p.r;x.lineTo(Math.cos(i*.628)*r,Math.sin(i*.628)*r)}x.fill();x.restore()}else{p.vy+=.25;x.globalAlpha=1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.l*.3);x.fillRect(-4,-2.5,8,5);x.restore()}});x.globalAlpha=1;
x.textAlign='center';x.textBaseline='middle';pops=pops.filter(p=>p.t-->0);pops.forEach(p=>{let e=80-p.t,k=e<6?e/6*1.3:e<12?1.3-(e-6)/6*.3:1;x.globalAlpha=Math.min(1,p.t/20);x.font=`900 ${p.sz*k}px Arial`;x.lineWidth=7;x.strokeStyle='#5a2a00';x.strokeText(p.s,p.x,p.y-(80-p.t)*.5);x.fillStyle=p.c;x.fillText(p.s,p.x,p.y-(80-p.t)*.5)});x.globalAlpha=1;
hud();x.restore()}
function loop(){step();try{draw()}catch(e){console.error(e)}requestAnimationFrame(loop)}
menu();loop();
